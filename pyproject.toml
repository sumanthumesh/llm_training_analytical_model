[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "analytical-model"
version = "0.1.0"
description = "Analytical model for evaluating network topology and parallelism configurations for LLM training."
requires-python = ">=3.10"

# The trace package lives on disk as src/tracegen (not src/trace) so that
# `import tracegen` can't be confused with -- or shadow -- the stdlib `trace`
# module; this also lets Pylance/Pyright resolve it by plain directory-name
# matching, the same way it already does for analytical/network, instead of
# needing to understand setuptools' package-dir remapping.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["analytical", "network", "tracegen", "coords"]
